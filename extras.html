        <script>
    // Lógica para mostrar/ocultar el menú al hacer clic
    const menuToggle = document.getElementById('menu-toggle');
    const menuContainer = document.querySelector('.contenedor-menu');

    menuToggle.addEventListener('click', (e) => {
      e.preventDefault(); // Evita el comportamiento predeterminado del enlace
      menuContainer.classList.toggle('active'); // Alterna la clase 'active'
    });

    // Cierra el menú si se hace clic fuera de él
    document.addEventListener('click', (e) => {
      if (!menuContainer.contains(e.target)) {
        menuContainer.classList.remove('active');
      }
    });
  </script>
  <style>
      .cintilla{
        margin-top: 10% !important;
        width: 100%;
        overflow: hidden;
        background: black;
        padding: 10px 0;
      }
      .carousel{
        margin: 0 auto;
        width: max-content;
        animation: scroll 15s linear infinite;
        display: flex;
        overflow-x: auto;
        background-color: black;
      }
      .group{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1em;
        animation: spin 10s infinite linear;
        padding-right: 1em;
      }
      .carousel::-webkit-scrollbar{
        display: none;
      }
      .card{
        flex: 0 0 4em;
        height: auto;
        width: auto;
        background: black;
        font-size: 3rem;
        border-radius: .2em;
        text-align: center;
        align-content: center;
        justify-content: center;
        justify-items: center;
        align-items: center;
      }
      @keyframes spin{
        from {translate: 0;}
        to {translate: -100%;}
      }
      @keyframes scroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%); /* Loop infinito fluido */
        }
      }
    </style>
